<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengajuan &amp; Approval Biaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F4F6;
    --panel:#FFFFFF;
    --line:#E2E5EA;
    --ink:#14181F;
    --ink-2:#5B6472;
    --ink-3:#8992A1;
    --brand:#1B3A5C;
    --brand-2:#24435F;
    --brand-soft:#E8EEF3;
    --ok:#1E7A5B;
    --ok-soft:#E4F3EC;
    --warn:#A85D14;
    --warn-soft:#FCEEE0;
    --danger:#B3261E;
    --danger-soft:#FBE9E7;
    --info:#2A5C8A;
    --info-soft:#E7F0F7;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Public Sans',system-ui,sans-serif;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  ::selection{background:#cfe0ee;}

  /* ---------- LOGIN ---------- */
  #screen-login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      linear-gradient(180deg, var(--brand) 0%, var(--brand) 260px, var(--bg) 260px);
  }
  .login-card{
    width:400px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(20,24,31,0.18);
    overflow:hidden;
  }
  .login-head{
    padding:28px 28px 20px;
    border-bottom:1px solid var(--line);
  }
  .login-head .eyebrow{
    color:var(--ink-3);
    font-size:12px;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .login-head h1{font-size:20px;font-weight:700;color:var(--brand);}
  .login-body{padding:24px 28px 28px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-2);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--brand-2);
    outline-offset:0;
    border-color:var(--brand-2);
  }
  .login-error{
    display:none;background:var(--danger-soft);color:var(--danger);border-radius:4px;
    padding:9px 11px;font-size:12.5px;font-weight:600;margin-bottom:14px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid transparent;
    border-radius:4px;
    padding:9px 16px;
    font-weight:600;
    font-size:13.5px;
  }
  .btn-primary{background:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-2);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2);}
  .btn-ghost:hover{background:var(--brand-soft);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-ok:hover{background:#176249;}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger-soft);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .hint{font-size:11.5px;color:var(--ink-3);margin-top:16px;text-align:center;line-height:1.6;}
  .hint b{color:var(--ink-2);}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  .sidebar{
    background:var(--brand);
    color:#DCE6EE;
    padding:22px 16px;
    display:flex;flex-direction:column;
  }
  .brand-mark{
    font-weight:800;font-size:16px;color:#fff;margin-bottom:2px;
  }
  .brand-sub{font-size:11.5px;color:#9FB4C7;margin-bottom:24px;}
  .who{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:var(--radius);
    padding:10px 12px;
    margin-bottom:22px;
  }
  .who .nm{font-weight:700;color:#fff;font-size:13.5px;}
  .who .rl{font-size:11.5px;color:#9FB4C7;text-transform:uppercase;letter-spacing:.03em;}
  nav.navlist{display:flex;flex-direction:column;gap:2px;flex:1;}
  nav.navlist button{
    text-align:left;
    background:transparent;border:none;
    color:#C7D6E2;
    padding:10px 12px;
    border-radius:4px;
    font-size:13.5px;
    font-weight:500;
    display:flex;justify-content:space-between;align-items:center;
  }
  nav.navlist button:hover{background:rgba(255,255,255,0.08);color:#fff;}
  nav.navlist button.active{background:#fff;color:var(--brand);font-weight:700;}
  .navlist .badge-count{
    background:var(--warn);color:#fff;font-size:11px;font-weight:700;
    border-radius:20px;padding:1px 7px;
  }
  nav.navlist button.active .badge-count{background:var(--warn);color:#fff;}
  .logout-btn{
    margin-top:16px;background:transparent;border:1px solid rgba(255,255,255,0.2);
    color:#DCE6EE;padding:9px;border-radius:4px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.08);}

  main{padding:26px 34px 60px;max-width:1160px;}
  .page-title{margin-bottom:4px;font-size:21px;font-weight:700;}
  .page-sub{color:var(--ink-2);font-size:13px;margin-bottom:22px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .panel-title{font-size:14.5px;font-weight:700;margin-bottom:14px;color:var(--brand);}
  .panel-title .n{color:var(--ink-3);font-weight:500;font-size:12.5px;margin-left:6px;}
  .panel-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel-head-row .panel-title{margin-bottom:0;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 16px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px 16px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-3);border-bottom:1px solid var(--line);padding:0 10px 8px;font-weight:700;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFC;}
  td.num, th.num{text-align:right;}
  .empty-row td{text-align:center;color:var(--ink-3);padding:26px;}
  .proses-cell{font-size:12px;color:var(--ink-2);line-height:1.7;white-space:nowrap;}
  .proses-cell b{color:var(--ink);}
  .proses-cell .tag-wait{color:var(--warn);font-weight:700;}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  }
  .badge-pending{background:var(--info-soft);color:var(--info);}
  .badge-approved{background:var(--brand-soft);color:var(--brand);}
  .badge-rejected{background:var(--danger-soft);color:var(--danger);}
  .badge-paid{background:var(--ok-soft);color:var(--ok);}
  .badge-overdue{background:var(--danger-soft);color:var(--danger);}
  .badge-today{background:var(--warn-soft);color:var(--warn);}

  .alertbar{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--warn-soft);border:1px solid #F0D6B8;border-left:4px solid var(--warn);
    border-radius:4px;padding:14px 16px;margin-bottom:20px;
  }
  .alertbar.danger{background:var(--danger-soft);border-color:#F1C6C1;border-left-color:var(--danger);}
  .alertbar strong{color:var(--warn);}
  .alertbar.danger strong{color:var(--danger);}
  .alertbar ul{margin:8px 0 0;padding-left:18px;}
  .alertbar li{margin-bottom:3px;}

  .item-head-row, .item-row{display:grid;grid-template-columns:1fr 64px 150px 130px 34px;gap:8px;align-items:center;}
  .item-head-row{margin-bottom:6px;padding:0 2px;}
  .item-head-row span{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;}
  .item-row{margin-bottom:8px;}
  .item-row input{width:100%;}
  .item-subtotal{text-align:right;padding:9px 4px;color:var(--ink-2);font-size:13px;}
  .remove-x{
    width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:4px;
    color:var(--ink-3);font-size:15px;line-height:1;
  }
  .remove-x:hover{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft);}

  .addrow-btn{
    background:transparent;border:1px dashed var(--line);color:var(--ink-2);
    width:100%;padding:8px;border-radius:4px;font-size:12.5px;font-weight:600;margin-top:2px;
  }
  .addrow-btn:hover{border-color:var(--brand);color:var(--brand);}

  .calc-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .calc-line:last-child{border-bottom:none;}
  .calc-line.total{font-weight:700;font-size:15px;padding-top:11px;color:var(--brand);}
  .calc-line .lbl{color:var(--ink-2);}
  .inline-pct{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;text-align:right;}

  .checkline{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .checkline input[type=checkbox]{width:16px;height:16px;}
  .checkline label{font-weight:600;font-size:13.5px;color:var(--ink);}
  .sub-controls{display:flex;gap:10px;align-items:center;margin:8px 0 4px 24px;flex-wrap:wrap;}
  .sub-controls select{padding:6px 8px;border:1px solid var(--line);border-radius:4px;}

  /* timeline */
  .tl-group{margin-bottom:22px;}
  .tl-group-label{
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink-3);margin-bottom:10px;padding-left:20px;
  }
  .tl-group.is-overdue .tl-group-label{color:var(--danger);}
  .tl-group.is-today .tl-group-label{color:var(--warn);}
  .tl-item{
    position:relative;padding-left:20px;padding-bottom:16px;border-left:2px solid var(--line);margin-left:5px;
  }
  .tl-item:last-child{border-left-color:transparent;padding-bottom:0;}
  .tl-item::before{
    content:'';position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;
    background:var(--info);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);
  }
  .tl-item.overdue::before{background:var(--danger);}
  .tl-item.today::before{background:var(--warn);}
  .tl-card{
    background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:11px 13px;
  }
  .tl-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;}
  .tl-top .tl-title{font-weight:700;font-size:13.5px;}
  .tl-meta{font-size:12px;color:var(--ink-2);}
  .tl-amount{font-weight:700;font-size:13.5px;}

  .modal-bg{
    position:fixed;inset:0;background:rgba(20,24,31,0.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff;border-radius:var(--radius);width:560px;max-width:100%;
    box-shadow:0 20px 50px rgba(20,24,31,0.3);
  }
  .modal-head{
    padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h3{font-size:15.5px;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--ink-3);}
  .modal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:16px;}
  .detail-grid .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;}
  .detail-grid .v{font-size:13.5px;font-weight:600;}
  .detail-section-title{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px;letter-spacing:.02em;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;
    border-radius:6px;font-size:13.5px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,0.25);
    opacity:0;transform:translateY(8px);transition:all .2s ease;z-index:80;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  textarea{resize:vertical;min-height:60px;}
  @media(max-width:900px){
    .shell{grid-template-columns:1fr;}
    .sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;}
    .who{display:none;}
    nav.navlist{flex-direction:row;flex-wrap:wrap;}
    main{padding:20px;}
    .grid2,.grid3,.grid4{grid-template-columns:1fr;}
    .item-head-row, .item-row{grid-template-columns:1fr 54px 110px 100px 30px;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-head">
      <div class="eyebrow">SISTEM PENGAJUAN &amp; PEMBAYARAN</div>
      <h1>Pengajuan &amp; Approval Biaya</h1>
    </div>
    <div class="login-body">
      <div class="login-error" id="login-error"></div>
      <div class="field">
        <label>Nama</label>
        <input type="text" id="login-nama" placeholder="Tulis nama akun Anda">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Password">
      </div>
      <button class="btn btn-primary btn-block" id="btn-login">Masuk</button>
      <div class="hint">
        Data tersimpan online di Supabase.<br>
        Hubungi admin sistem jika Anda belum memiliki akun.
      </div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="brand-mark">Pengajuan Biaya</div>
      <div class="brand-sub">Bon &amp; Tagihan · Approval · Pembayaran</div>
      <div class="who">
        <div class="nm" id="who-nama">-</div>
        <div class="rl" id="who-role">-</div>
      </div>
      <nav class="navlist" id="navlist"></nav>
      <button class="logout-btn" id="btn-refresh">Segarkan Data</button>
      <button class="logout-btn" id="btn-logout">Keluar</button>
      <div id="sync-indicator" style="font-size:11px;color:#9FB4C7;text-align:center;margin-top:10px;"></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATA LAYER
========================================================= */
const STORE_KEY = 'pengajuan_biaya_data_v2'; // cache cadangan lokal, bukan sumber data utama

/* --- Koneksi ke Supabase (Database as a Service) ---
   Isi 2 nilai di bawah ini dengan punya Anda sendiri setelah membuat project
   di supabase.com (lihat langkah-langkah yang dikirim bersama file ini).
   SUPABASE_ANON_KEY aman ditaruh di file frontend karena akses tabel
   dibatasi lewat Row Level Security (RLS) di sisi Supabase. */
const SUPABASE_URL = 'https://ftjxibbimdmlmdrlugpd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_H743Uqs9a6J6zyzT7kthnQ_U_3_vCLs';
const SUPABASE_ROW_ID = 'main'; // id baris tunggal tempat seluruh data aplikasi disimpan

function supabaseHeaders(extra){
  /* Key format baru (sb_publishable_...) bukan JWT, jadi cukup dikirim lewat header apikey.
     Header Authorization hanya dikirim bila key masih format JWT lama (eyJ...). */
  const h = { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  if(SUPABASE_ANON_KEY.indexOf('eyJ') === 0) h['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
  return Object.assign(h, extra||{});
}

async function fetchRemoteData(){
  const url = SUPABASE_URL + '/rest/v1/app_state?id=eq.' + encodeURIComponent(SUPABASE_ROW_ID) + '&select=data';
  const res = await fetch(url, { method:'GET', headers: supabaseHeaders() });
  if(!res.ok){ throw new Error('Gagal mengambil data dari Supabase (HTTP '+res.status+')'); }
  const rows = await res.json();
  if(!rows || !rows.length) return {}; // belum ada baris tersimpan
  return rows[0].data || {};
}

let SYNCING = false;
let LAST_SYNC_ERROR = null;
async function pushRemoteData(){
  SYNCING = true;
  updateSyncIndicator();
  try{
    const url = SUPABASE_URL + '/rest/v1/app_state?on_conflict=id';
    const res = await fetch(url, {
      method:'POST',
      headers: supabaseHeaders({ 'Prefer':'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([{ id: SUPABASE_ROW_ID, data: DB, updated_at: new Date().toISOString() }])
    });
    if(!res.ok){ throw new Error('Gagal menyimpan ke Supabase (HTTP '+res.status+')'); }
    LAST_SYNC_ERROR = null;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ /* abaikan kalau storage penuh */ }
  } catch(err){
    LAST_SYNC_ERROR = err;
    console.error('Gagal menyimpan ke Supabase:', err);
    toast('Gagal sinkron ke server. Periksa koneksi internet.');
  } finally {
    SYNCING = false;
    updateSyncIndicator();
  }
}
function saveData(){ pushRemoteData(); }
function updateSyncIndicator(){
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  if(SYNCING){ el.textContent = 'Menyimpan ke server…'; }
  else if(LAST_SYNC_ERROR){ el.textContent = 'Gagal sinkron — periksa koneksi'; }
  else { el.textContent = 'Tersimpan di Supabase'; }
}

function normalizeRemoteData(remote){
  return {
    users: remote.users || [],
    saldoAwal: (remote.saldoAwal===undefined || remote.saldoAwal===null) ? 100000000 : Number(remote.saldoAwal),
    transaksiKas: remote.transaksiKas || [],
    pengaturan: remote.pengaturan || { namaPerusahaan:'', npwp:'' },
    pengajuan: remote.pengajuan || []
  };
}
function seedUsersOnly(){
  return [
    {id: uid('U'), nama:'123', password:'123', role:'finance'},
    {id: uid('U'), nama:'Wulan Finance', password:'finance123', role:'finance'},
    {id: uid('U'), nama:'Rina Approver', password:'approver123', role:'approver'},
    {id: uid('U'), nama:'Dedi Kurniawan', password:'dedi123', role:'karyawan'}
  ];
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function daysBetween(isoA, isoB){
  if(!isoA || !isoB) return 0;
  const a = new Date(isoA+'T00:00:00');
  const b = new Date(isoB+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function uid(prefix){
  return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function nextNomor(){
  const year = new Date().getFullYear();
  const count = DB.pengajuan.filter(p => p.nomor && p.nomor.includes(String(year))).length + 1;
  return 'PB-' + year + '-' + String(count).padStart(4,'0');
}
function rupiah(n){
  n = Number(n)||0;
  return 'Rp ' + n.toLocaleString('id-ID', {maximumFractionDigits:0});
}
function tglIndo(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
}
function tglSingkat(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID', {day:'numeric', month:'numeric', year:'2-digit'});
}
function hariIndo(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
const BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function bulanIndo(i){ return BULAN_ID[i]; }

function terbilang(n){
  n = Math.floor(Math.abs(Number(n)||0));
  const satuan = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  function convert(num){
    if(num < 12) return satuan[num];
    if(num < 20) return convert(num-10)+' belas';
    if(num < 100) return convert(Math.floor(num/10))+' puluh'+(num%10!==0?' '+convert(num%10):'');
    if(num < 200) return 'seratus'+(num%100!==0?' '+convert(num%100):'');
    if(num < 1000) return convert(Math.floor(num/100))+' ratus'+(num%100!==0?' '+convert(num%100):'');
    if(num < 2000) return 'seribu'+(num%1000!==0?' '+convert(num%1000):'');
    if(num < 1000000) return convert(Math.floor(num/1000))+' ribu'+(num%1000!==0?' '+convert(num%1000):'');
    if(num < 1000000000) return convert(Math.floor(num/1000000))+' juta'+(num%1000000!==0?' '+convert(num%1000000):'');
    if(num < 1000000000000) return convert(Math.floor(num/1000000000))+' miliar'+(num%1000000000!==0?' '+convert(num%1000000000):'');
    return convert(Math.floor(num/1000000000000))+' triliun'+(num%1000000000000!==0?' '+convert(num%1000000000000):'');
  }
  if(n===0) return 'nol';
  return convert(n).trim().replace(/\s+/g,' ');
}
function terbilangRupiah(n){
  const words = terbilang(n);
  return words.charAt(0).toUpperCase()+words.slice(1)+' Rupiah';
}

let DB = null;

async function bootApp(){
  setLoginLoading('loading');
  try{
    const remote = await fetchRemoteData();
    DB = normalizeRemoteData(remote);
    if(!DB.users.length){
      DB.users = seedUsersOnly();
      await pushRemoteData(); // simpan user awal ke Sheet supaya ada akun untuk login
    }
    setLoginLoading('ready');
  } catch(err){
    console.error('Gagal memuat data dari server:', err);
    setLoginLoading('error', err);
  }
}

function setLoginLoading(state, err){
  const btn = document.getElementById('btn-login');
  const errBox = document.getElementById('login-error');
  const namaInput = document.getElementById('login-nama');
  const passInput = document.getElementById('login-password');
  if(state==='loading'){
    btn.disabled = true; btn.textContent = 'Memuat data…';
    namaInput.disabled = true; passInput.disabled = true;
    errBox.style.display='none';
  } else if(state==='error'){
    btn.disabled = false; btn.textContent = 'Coba Lagi';
    namaInput.disabled = true; passInput.disabled = true;
    errBox.textContent = 'Gagal memuat data dari server. Periksa koneksi internet, lalu klik "Coba Lagi". (' + (err&&err.message?err.message:'error') + ')';
    errBox.style.display='block';
  } else {
    btn.disabled = false; btn.textContent = 'Masuk';
    namaInput.disabled = false; passInput.disabled = false;
    errBox.style.display='none';
  }
}

/* helper: total transaksi manual (kas/bank) & pembayaran pengajuan SEBELUM tanggal tertentu (net outflow) */
function saldoNetOutBefore(beforeISO){
  const paidBefore = DB.pengajuan.filter(p=>p.status==='Sudah Dibayar' && p.tanggalBayar && p.tanggalBayar < beforeISO)
    .reduce((s,p)=>s+hitung(p).total,0);
  const txBefore = (DB.transaksiKas||[]).filter(t=>t.tanggal < beforeISO);
  const txIn = txBefore.filter(t=>t.jenis==='masuk').reduce((s,t)=>s+(Number(t.jumlah)||0),0);
  const txOut = txBefore.filter(t=>t.jenis==='keluar').reduce((s,t)=>s+(Number(t.jumlah)||0),0);
  return paidBefore + txOut - txIn;
}

/* helpers on a pengajuan record */
function hitung(p){
  const subtotal = p.items.reduce((s,it)=>s+((Number(it.qty)||0)*(Number(it.harga)||0)),0);
  const ppn = p.ppnAktif ? Math.round(subtotal * (Number(p.ppnPersen)||0) / 100) : 0;
  const pph = p.pphAktif ? Math.round(subtotal * (Number(p.pphPersen)||0) / 100) : 0;
  const total = subtotal + ppn - pph;
  return {subtotal, ppn, pph, total};
}
function dueBucket(iso){
  const t = todayISO();
  if(iso < t) return 'overdue';
  if(iso === t) return 'today';
  return 'upcoming';
}
function buildProsesTrail(p){
  const rows = [`<div><b>Diajukan</b>: ${tglSingkat(p.tanggalPengajuan)}</div>`];
  if(p.status==='Menunggu Persetujuan'){
    rows.push(`<div class="tag-wait">Menunggu persetujuan</div>`);
  } else if(p.status==='Ditolak'){
    const d = daysBetween(p.tanggalPengajuan, p.approvedAt);
    rows.push(`<div><b>Ditolak</b>: ${tglSingkat(p.approvedAt)} (+${d} hari)</div>`);
  } else {
    const d1 = daysBetween(p.tanggalPengajuan, p.approvedAt);
    rows.push(`<div><b>Disetujui</b>: ${tglSingkat(p.approvedAt)} (+${d1} hari)</div>`);
    if(p.status==='Sudah Dibayar'){
      const d2 = daysBetween(p.approvedAt, p.tanggalBayar);
      rows.push(`<div><b>Dibayar</b>: ${tglSingkat(p.tanggalBayar)} (+${d2} hari)</div>`);
    } else {
      rows.push(`<div class="tag-wait">Masih proses finance</div>`);
    }
  }
  return `<div class="proses-cell">${rows.join('')}</div>`;
}

function doLogin(){
  if(!DB){ bootApp(); return; }
  const nama = document.getElementById('login-nama').value.trim();
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  const user = DB.users.find(u=>u.nama.trim().toLowerCase()===nama.toLowerCase() && u.password===password);
  if(!nama || !password){ errBox.textContent='Isi nama dan password terlebih dulu.'; errBox.style.display='block'; return; }
  if(!user){ errBox.textContent='Nama atau password salah.'; errBox.style.display='block'; return; }
  errBox.style.display='none';
  SESSION = {nama:user.nama, role:user.role, userId:user.id};
  document.getElementById('screen-login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('who-nama').textContent = user.nama;
  document.getElementById('who-role').textContent = roleLabel(user.role);
  buildNav();
  goto(defaultViewFor(user.role));
}

  ]

function counts(){
  const pending = DB.pengajuan.filter(p=>p.status==='Menunggu Persetujuan').length;
  const toPay = DB.pengajuan.filter(p=>p.status==='Disetujui').length;
  const dueToday = DB.pengajuan.filter(p=>p.status==='Disetujui' && dueBucket(p.dueDate)!=='upcoming').length;
  return {pending, toPay, dueToday};
}

function buildNav(){
  const nav = document.getElementById('navlist');
  const items = NAV[SESSION.role];
  const c = counts();
  nav.innerHTML = items.map(it=>{
    const count = it.countKey ? c[it.countKey] : 0;
    return `<button data-view="${it.id}">
      <span>${it.label}</span>
      ${count>0 ? `<span class="badge-count">${count}</span>` : ''}
    </button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>goto(b.dataset.view));
  });
}

let CURRENT_VIEW = null;
function goto(view){
  CURRENT_VIEW = view;
  document.querySelectorAll('#navlist button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===view);
  });
  render();
}

/* =========================================================
   TOAST
========================================================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   RENDER ROUTER
========================================================= */
function render(){
  buildNav(); // refresh counts each render
  document.querySelectorAll('#navlist button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===CURRENT_VIEW);
  });
  const main = document.getElementById('main');
  if(CURRENT_VIEW==='karyawan-dashboard') main.innerHTML = viewKaryawanDashboard();
  else if(CURRENT_VIEW==='ajukan') main.innerHTML = viewAjukan();
  else if(CURRENT_VIEW==='karyawan-list') main.innerHTML = viewKaryawanList();
  else if(CURRENT_VIEW==='approval-pending') main.innerHTML = viewApprovalPending();
  else if(CURRENT_VIEW==='approval-history') main.innerHTML = viewApprovalHistory();
  else if(CURRENT_VIEW==='finance-dashboard') main.innerHTML = viewFinanceDashboard();
  else if(CURRENT_VIEW==='finance-payment') main.innerHTML = viewFinancePayment();
  else if(CURRENT_VIEW==='finance-history') main.innerHTML = viewFinanceHistory();
  else if(CURRENT_VIEW==='finance-cashflow') main.innerHTML = viewCashflowBulanan();
  else if(CURRENT_VIEW==='finance-cashflow-harian') main.innerHTML = viewCashflowHarian();
  else if(CURRENT_VIEW==='finance-saldo-awal') main.innerHTML = viewSaldo();
  else if(CURRENT_VIEW==='kelola-pengguna') main.innerHTML = viewKelolaPengguna();
  else if(CURRENT_VIEW==='finance-pengaturan') main.innerHTML = viewPengaturan();
  attachViewHandlers();
}

/* =========================================================
   BADGES
========================================================= */
function statusBadge(p){
  if(p.status==='Menunggu Persetujuan') return `<span class="badge badge-pending">Menunggu Persetujuan</span>`;
  if(p.status==='Ditolak') return `<span class="badge badge-rejected">Ditolak</span>`;
  if(p.status==='Sudah Dibayar') return `<span class="badge badge-paid">Sudah Dibayar</span>`;
  if(p.status==='Disetujui'){
    const b = dueBucket(p.dueDate);
    if(b==='overdue') return `<span class="badge badge-overdue">Disetujui · Lewat Jatuh Tempo</span>`;
    if(b==='today') return `<span class="badge badge-today">Disetujui · Jatuh Tempo Hari Ini</span>`;
    return `<span class="badge badge-approved">Disetujui</span>`;
  }
  return '';
}

function viewKaryawanDashboard(){

  const menunggu = mine.filter(p=>p.status==='Menunggu Persetujuan');
  const disetujui = mine.filter(p=>p.status==='Disetujui');
  const ditolak = mine.filter(p=>p.status==='Ditolak');
  const dibayar = mine.filter(p=>p.status==='Sudah Dibayar');
  const totalDiajukan = mine.reduce((s,p)=>s+hitung(p).total,0);
  const totalDibayar = dibayar.reduce((s,p)=>s+hitung(p).total,0);
  const recent = mine.slice().sort((a,b)=>b.tanggalPengajuan.localeCompare(a.tanggalPengajuan)).slice(0,5);

  const recentRows = recent.length ? recent.map(p=>{
    const h = hitung(p);

function renderItemRows(){
  const wrap = document.getElementById('items-wrap');
  if(!wrap) return;
  wrap.innerHTML = draftItems.map((it,i)=>`
    <div class="item-row" data-row="${i}">
      <input placeholder="Deskripsi biaya" value="${it.deskripsi}" data-idx="${i}" data-f="deskripsi" class="item-input">
      <input placeholder="1" type="number" min="0" step="1" value="${it.qty}" data-idx="${i}" data-f="qty" class="item-input">
      <input placeholder="Rp" type="number" min="0" value="${it.harga}" data-idx="${i}" data-f="harga" class="item-input">
      <div class="item-subtotal mono" data-sub="${i}">${rupiah((Number(it.qty)||0)*(Number(it.harga)||0))}</div>
      <button type="button" class="remove-x" data-idx="${i}" title="Hapus baris">&times;</button>
    </div>
  `).join('');
  // Catatan: input TIDAK memicu render ulang seluruh baris (itu penyebab kursor
  // "lompat"/huruf berpindah saat mengetik). Hanya nilai data & subtotal baris
  // yang bersangkutan yang diperbarui; DOM input yang sedang diketik tidak disentuh.
  wrap.querySelectorAll('.item-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = Number(e.target.dataset.idx);
      draftItems[i][e.target.dataset.f] = e.target.value;
      const sub = wrap.querySelector(`.item-subtotal[data-sub="${i}"]`);
      if(sub) sub.textContent = rupiah((Number(draftItems[i].qty)||0)*(Number(draftItems[i].harga)||0));
      recalcDraft();
    });
  });
  wrap.querySelectorAll('.remove-x').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = Number(e.target.dataset.idx);
      if(draftItems.length>1){ draftItems.splice(i,1); renderItemRows(); recalcDraft(); }
    });
  });
}

function recalcDraft(){
  const subtotal = draftItems.reduce((s,it)=>s+((Number(it.qty)||0)*(Number(it.harga)||0)),0);
  const ppnAktif = document.getElementById('f-ppn-aktif').checked;
  const pphAktif = document.getElementById('f-pph-aktif').checked;
  const ppnPersen = Number(document.getElementById('f-ppn-persen').value)||0;
  const pphPersen = Number(document.getElementById('f-pph-persen').value)||0;
  const ppn = ppnAktif ? Math.round(subtotal*ppnPersen/100) : 0;
  const pph = pphAktif ? Math.round(subtotal*pphPersen/100) : 0;
  const total = subtotal + ppn - pph;
  document.getElementById('calc-subtotal').textContent = rupiah(subtotal);
  document.getElementById('calc-ppn').textContent = rupiah(ppn);
  document.getElementById('calc-pph').textContent = '- ' + rupiah(pph);
  document.getElementById('calc-total').textContent = rupiah(total);
}

/* =========================================================
   VIEW: FINANCE — DASHBOARD
========================================================= */
function viewFinanceDashboard(){
  const approvedUnpaid = DB.pengajuan.filter(p=>p.status==='Disetujui');
  const overdue = approvedUnpaid.filter(p=>dueBucket(p.dueDate)==='overdue');
  const dueToday = approvedUnpaid.filter(p=>dueBucket(p.dueDate)==='today');

  let alerts = '';
  if(overdue.length){
    alerts += `<div class="alertbar danger">
      <div>
        <strong>${overdue.length} tagihan sudah lewat jatuh tempo</strong> dan belum dibayar.
        <ul>${overdue.map(p=>`<li>${p.dibayarkanKepada} — ${rupiah(hitung(p).total)} · jatuh tempo ${tglIndo(p.dueDate)}</li>`).join('')}</ul>
      </div>
    </div>`;
  }
  if(dueToday.length){
    alerts += `<div class="alertbar">
      <div>
        <strong>${dueToday.length} tagihan harus dibayar HARI INI</strong> (${hariIndo(todayISO())}).
        <ul>${dueToday.map(p=>`<li>${p.dibayarkanKepada} — ${rupiah(hitung(p).total)} · No. ${p.nomor}</li>`).join('')}</ul>
      </div>
    </div>`;
  }
  if(!overdue.length && !dueToday.length){
    alerts += `<div class="alertbar" style="background:var(--ok-soft);border-color:#BFE3D2;border-left-color:var(--ok);">
      <div><strong style="color:var(--ok);">Tidak ada tagihan jatuh tempo hari ini.</strong> Semua tagihan yang disetujui masih dalam jadwal.</div>
    </div>`;
  }

  // daftar tagihan (tabel)
  const listTagihan = approvedUnpaid.slice().sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const tabelTagihan = `
    <table>
      <thead><tr>
        <th>No. Pengajuan</th><th>No. Invoice</th><th>Dibayarkan Kepada</th><th>Kegiatan</th>
        <th>Jatuh Tempo</th><th class="num">Total</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${listTagihan.length? listTagihan.map(p=>{
          const h = hitung(p);
          return `<tr>
            <td class="mono">${p.nomor}</td>
            <td class="mono">${p.noInvoice||'-'}</td>
            <td>${p.dibayarkanKepada}</td>
            <td>${p.kegiatan}</td>
            <td>${tglIndo(p.dueDate)}</td>
            <td class="num mono">${rupiah(h.total)}</td>
            <td>${statusBadge(p)}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" data-detail="${p.id}">Lihat</button>
              <button class="btn btn-ok btn-sm" data-pay="${p.id}">Bayar</button>
            </td>
          </tr>`;
        }).join('') : `<tr class="empty-row"><td colspan="8">Tidak ada tagihan yang menunggu pembayaran.</td></tr>`}
      </tbody>
    </table>`;

  // timeline grouping
  const groups = {};
  listTagihan.forEach(p=>{
    const key = p.dueDate;
    groups[key] = groups[key] || [];
    groups[key].push(p);
  });
  const dateKeys = Object.keys(groups).sort();

  const timelineHTML = dateKeys.length ? dateKeys.map(dateKey=>{
    const bucket = dueBucket(dateKey);
    const groupLabel = bucket==='overdue' ? 'Lewat jatuh tempo · ' + tglIndo(dateKey)
                      : bucket==='today' ? 'Hari ini · ' + tglIndo(dateKey)
                      : hariIndo(dateKey);
    return `
    <div class="tl-group ${bucket==='overdue'?'is-overdue':''} ${bucket==='today'?'is-today':''}">
      <div class="tl-group-label">${groupLabel}</div>
      ${groups[dateKey].map(p=>{
        const h = hitung(p);
        return `<div class="tl-item ${bucket}">
          <div class="tl-card">
            <div class="tl-top">
              <span class="tl-title">${p.dibayarkanKepada}</span>
              <span class="tl-amount mono">${rupiah(h.total)}</span>
            </div>
            <div class="tl-meta">${p.nomor}${p.noInvoice?' · '+p.noInvoice:''} · ${p.kegiatan} · diajukan oleh ${p.pemohon}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('') : `<div style="text-align:center;color:var(--ink-3);padding:10px;">Belum ada tagihan yang disetujui dan menunggu pembayaran.</div>`;

  // jumlah pengajuan per karyawan (bulan berjalan)
  const now = new Date();
  const curYear = now.getFullYear(), curMonth = now.getMonth();
  const thisMonthPengajuan = DB.pengajuan.filter(p=>{
    const d = new Date(p.tanggalPengajuan+'T00:00:00');
    return d.getFullYear()===curYear && d.getMonth()===curMonth;
  });
  const byKaryawan = {};
  thisMonthPengajuan.forEach(p=>{
    byKaryawan[p.pemohon] = byKaryawan[p.pemohon] || {count:0, total:0};
    byKaryawan[p.pemohon].count++;
    byKaryawan[p.pemohon].total += hitung(p).total;
  });
  const karyawanNames = Object.keys(byKaryawan).sort((a,b)=>byKaryawan[b].count-byKaryawan[a].count);
  const karyawanRows = karyawanNames.length ? karyawanNames.map(nm=>{
    const d = byKaryawan[nm];
    return `<tr><td>${nm}</td><td class="num">${d.count}</td><td class="num mono">${rupiah(d.total)}</td></tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="3">Belum ada pengajuan bulan ini.</td></tr>`;

  return `
  <div class="page-title">Dashboard Finance</div>
  <div class="page-sub">Ringkasan tagihan yang perlu diperhatikan hari ini.</div>
  ${alerts}
  <div class="panel">
    <div class="panel-title">Daftar Tagihan Menunggu Pembayaran <span class="n">(${listTagihan.length})</span></div>
    ${tabelTagihan}
  </div>
  <div class="panel">
    <div class="panel-title">Jumlah Pengajuan per Karyawan — ${bulanIndo(curMonth)} ${curYear}</div>
    <table>
      <thead><tr><th>Karyawan</th><th class="num">Jumlah Pengajuan</th><th class="num">Total Nilai</th></tr></thead>
      <tbody>${karyawanRows}</tbody>
    </table>
  </div>
  <div class="panel">
    <div class="panel-title">Timeline Tagihan yang Harus Dikeluarkan</div>
    ${timelineHTML}
  </div>`;
}

/* =========================================================
   VIEW: FINANCE — CASH FLOW (RINGKASAN BULANAN)
========================================================= */
let CF_YEAR = null;
function viewCashflowBulanan(){
  const todayD = new Date();
  const year = CF_YEAR || todayD.getFullYear();
  const monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const paid = DB.pengajuan.filter(p=>p.status==='Sudah Dibayar' && p.tanggalBayar);
  const monthlyIn = Array(12).fill(0);
  const monthlyOut = Array(12).fill(0);
  paid.forEach(p=>{
    const d = new Date(p.tanggalBayar+'T00:00:00');
    if(d.getFullYear()===year){ monthlyOut[d.getMonth()] += hitung(p).total; }
  });
  (DB.transaksiKas||[]).forEach(t=>{
    const d = new Date(t.tanggal+'T00:00:00');
    if(d.getFullYear()===year){
      if(t.jenis==='masuk') monthlyIn[d.getMonth()] += Number(t.jumlah)||0;
      else monthlyOut[d.getMonth()] += Number(t.jumlah)||0;
    }
  });
  let saldo = (Number(DB.saldoAwal)||0) - saldoNetOutBefore(year+'-01-01');
  const rows = monthNames.map((m,i)=>{
    const awal = saldo;
    const masuk = monthlyIn[i];
    const keluar = monthlyOut[i];
    const akhir = awal + masuk - keluar;
    saldo = akhir;
    return {m, awal, masuk, keluar, akhir};
  });
  const saldoSaatIni = (Number(DB.saldoAwal)||0) - saldoNetOutBefore(addDays(todayISO(),1));
  const proyeksiAkhirTahun = rows[11].akhir;
  const totalMasuk = monthlyIn.reduce((a,b)=>a+b,0);
  const totalKeluar = monthlyOut.reduce((a,b)=>a+b,0);

  const yearsAvail = Array.from(new Set(
    DB.pengajuan.filter(p=>p.tanggalBayar).map(p=>new Date(p.tanggalBayar+'T00:00:00').getFullYear())
      .concat((DB.transaksiKas||[]).map(t=>new Date(t.tanggal+'T00:00:00').getFullYear()))
      .concat([todayD.getFullYear()])
  )).sort((a,b)=>a-b);

  const tableRows = rows.map(r=>`<tr>
    <td>${r.m}</td>
    <td class="num mono">${rupiah(r.awal)}</td>
    <td class="num mono">${r.masuk? rupiah(r.masuk) : 'Rp 0'}</td>
    <td class="num mono">${r.keluar? '- '+rupiah(r.keluar) : 'Rp 0'}</td>
    <td class="num mono" style="${r.akhir<0?'color:var(--danger);font-weight:700;':''}">${rupiah(r.akhir)}</td>
  </tr>`).join('');

  return `
  <div class="page-title">Cash Flow (Ringkasan Bulanan)</div>
  <div class="page-sub">Dihitung dari Saldo, tagihan yang sudah dibayar, dan transaksi Kas/Bank Masuk &amp; Keluar per bulan.</div>
  <div class="panel">
    <div class="panel-head-row">
      <div class="panel-title">Tahun</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="cf-year">${yearsAvail.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select>
        <button class="btn btn-ghost btn-sm" id="btn-cf-csv">Export Excel</button>
        <button class="btn btn-ghost btn-sm" id="btn-cf-print">Cetak PDF</button>
      </div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">
    <div class="panel" style="margin-bottom:0;"><div class="panel-title">Saldo Kas Saat Ini</div><div style="font-size:18px;font-weight:700;" class="mono">${rupiah(saldoSaatIni)}</div></div>
    <div class="panel" style="margin-bottom:0;"><div class="panel-title">Proyeksi Akhir Tahun ${year}</div><div style="font-size:18px;font-weight:700;" class="mono">${rupiah(proyeksiAkhirTahun)}</div></div>
    <div class="panel" style="margin-bottom:0;"><div class="panel-title">Total Kas Masuk ${year}</div><div style="font-size:18px;font-weight:700;color:var(--ok);" class="mono">${rupiah(totalMasuk)}</div></div>
    <div class="panel" style="margin-bottom:0;"><div class="panel-title">Total Kas Keluar ${year}</div><div style="font-size:18px;font-weight:700;color:var(--danger);" class="mono">${rupiah(totalKeluar)}</div></div>
  </div>
  <div class="panel">
    <div class="panel-title">Cash Flow Bulanan — Tahun ${year}</div>
    <table id="cf-table">
      <thead><tr><th>Bulan</th><th class="num">Saldo Awal</th><th class="num">Kas Masuk</th><th class="num">Kas Keluar</th><th class="num">Saldo Akhir</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>`;
}

/* =========================================================
   VIEW: FINANCE — DETAIL CASH FLOW HARIAN
========================================================= */
let CF_MONTH = null;
function viewCashflowHarian(){
  const todayD = new Date();
  const monthVal = CF_MONTH || (todayD.getFullYear()+'-'+String(todayD.getMonth()+1).padStart(2,'0'));
  const [yy, mm] = monthVal.split('-').map(Number);
  const daysInMonth = new Date(yy, mm, 0).getDate();
  const paid = DB.pengajuan.filter(p=>p.status==='Sudah Dibayar' && p.tanggalBayar);
  const dailyOut = {};
  const dailyIn = {};
  paid.forEach(p=>{ dailyOut[p.tanggalBayar] = (dailyOut[p.tanggalBayar]||0) + hitung(p).total; });
  (DB.transaksiKas||[]).forEach(t=>{
    if(t.jenis==='masuk') dailyIn[t.tanggal] = (dailyIn[t.tanggal]||0) + (Number(t.jumlah)||0);
    else dailyOut[t.tanggal] = (dailyOut[t.tanggal]||0) + (Number(t.jumlah)||0);
  });

  const firstOfMonth = monthVal+'-01';
  let saldo = (Number(DB.saldoAwal)||0) - saldoNetOutBefore(firstOfMonth);
  const todayISOStr = todayISO();
  const dayNames = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const rows = [];
  for(let d=1; d<=daysInMonth; d++){
    const iso = monthVal+'-'+String(d).padStart(2,'0');
    const awal = saldo;
    const masuk = dailyIn[iso]||0;
    const keluar = dailyOut[iso]||0;
    const akhir = awal + masuk - keluar;
    saldo = akhir;
    const status = iso <= todayISOStr ? 'Aktual' : 'Proyeksi';
    const dow = dayNames[new Date(iso+'T00:00:00').getDay()];
    rows.push({iso, dow, status, awal, masuk, keluar, akhir});
  }
  const tableRows = rows.map(r=>`<tr ${r.akhir<0?'style="color:var(--danger);font-weight:700;"':''}>
    <td>${tglSingkat(r.iso)}</td><td>${r.dow}</td><td>${r.status}</td>
    <td class="num mono">${rupiah(r.awal)}</td>
    <td class="num mono">${r.masuk? rupiah(r.masuk) : '-'}</td>
    <td class="num mono">${r.keluar? '- '+rupiah(r.keluar) : '-'}</td>
    <td class="num mono">${rupiah(r.akhir)}</td>
  </tr>`).join('');

  return `
  <div class="page-title">Detail Cash Flow Harian</div>
  <div class="page-sub">Rincian per tanggal supaya bisa terlihat kapan saldo kas menipis, termasuk transaksi Kas/Bank Masuk &amp; Keluar. Baris dengan saldo <b style="color:var(--danger);">merah</b> berarti proyeksi kas di tanggal itu minus/kurang.</div>
  <div class="panel">
    <div class="panel-head-row">
      <div class="panel-title">Bulan</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="month" id="cfh-month" value="${monthVal}">
        <button class="btn btn-ghost btn-sm" id="btn-cfh-csv">Export Excel</button>
        <button class="btn btn-ghost btn-sm" id="btn-cfh-print">Cetak PDF</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <table id="cfh-table">
      <thead><tr><th>Tanggal</th><th>Hari</th><th>Status</th><th class="num">Saldo Awal</th><th class="num">Pemasukan</th><th class="num">Pengeluaran</th><th class="num">Saldo Akhir</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>`;
}

      <div class="field" style="margin-top:16px;">
        <label>Catatan (wajib diisi jika menolak)</label>
        <textarea id="review-catatan" placeholder="Tulis catatan persetujuan atau alasan penolakan"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="btn-reject">Tolak</button>
      <button class="btn btn-ok" id="btn-approve">Setujui</button>
    </div>
  `);
  document.getElementById('btn-approve').addEventListener('click', ()=>{
    p.status='Disetujui'; p.approvedBy=SESSION.nama; p.approvedAt=todayISO();
    p.catatan=document.getElementById('review-catatan').value.trim();
    saveData(); closeModal(); toast('Pengajuan disetujui.'); render();
  });
  document.getElementById('btn-reject').addEventListener('click', ()=>{
    const cat = document.getElementById('review-catatan').value.trim();
    if(!cat){ alert('Tulis alasan penolakan terlebih dulu.'); return; }
    p.status='Ditolak'; p.approvedBy=SESSION.nama; p.approvedAt=todayISO(); p.catatan=cat;
    saveData(); closeModal(); toast('Pengajuan ditolak.'); render();
  });
}

/* =========================================================
   PAY MODAL (checklist + no voucher)
========================================================= */
function openPay(id){
  const p = DB.pengajuan.find(x=>x.id===id);
  const h = hitung(p);
  showModal(`
    <div class="modal-head"><h3>Konfirmasi Pembayaran — ${p.nomor}</h3><button class="modal-close" id="modal-x">&times;</button></div>
    <div class="modal-body">
      <div class="detail-grid">
        <div><div class="k">Dibayarkan Kepada</div><div class="v">${p.dibayarkanKepada}</div></div>
        <div><div class="k">No. Invoice</div><div class="v mono">${p.noInvoice||'-'}</div></div>
        <div><div class="k">Total Dibayarkan</div><div class="v mono">${rupiah(h.total)}</div></div>
        <div><div class="k">Bank / No. Rekening</div><div class="v">${p.bankTujuan} · <span class="mono">${p.noRekening}</span></div></div>
        <div><div class="k">Atas Nama</div><div class="v">${p.atasNama}</div></div>
      </div>
      <div class="field" style="margin-top:6px;">
        <label>Tanggal Pembayaran</label>
        <input type="date" id="pay-tanggal" value="${todayISO()}">
      </div>
      <div class="field">
        <label>No. Voucher Bukti Pembayaran</label>
        <input id="pay-voucher" placeholder="cth. VC-0102">
      </div>
      <div class="checkline">
        <input type="checkbox" id="pay-confirm">
        <label for="pay-confirm">Saya konfirmasi transfer sejumlah ${rupiah(h.total)} telah dilakukan</label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modal-close-btn">Batal</button>
      <button class="btn btn-ok" id="btn-confirm-pay">Simpan &amp; Tandai Sudah Dibayar</button>
    </div>
  `);
  document.getElementById('btn-confirm-pay').addEventListener('click', ()=>{
    const voucher = document.getElementById('pay-voucher').value.trim();
    const tgl = document.getElementById('pay-tanggal').value;
    const confirmed = document.getElementById('pay-confirm').checked;
    if(!voucher){ alert('No. Voucher wajib diisi.'); return; }
    if(!tgl){ alert('Tanggal pembayaran wajib diisi.'); return; }
    if(!confirmed){ alert('Centang konfirmasi transfer terlebih dulu.'); return; }
    p.status='Sudah Dibayar'; p.dibayar=true; p.tanggalBayar=tgl; p.noVoucher=voucher; p.dibayarOleh=SESSION.nama;
    saveData(); closeModal(); toast('Pembayaran dicatat.'); render();
  });
}

function exportCSV(filename, rows){
  const csv = rows.map(r=>r.map(c=>{
    c = (c===null||c===undefined)?'':String(c);
    if(c.indexOf(',')>-1||c.indexOf('"')>-1||c.indexOf('\n')>-1){ c = '"'+c.replace(/"/g,'""')+'"'; }
    return c;
  }).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================
   MODAL PLUMBING
========================================================= */
function showModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
  const x = document.getElementById('modal-x');
  const c = document.getElementById('modal-close-btn');
  if(x) x.addEventListener('click', closeModal);
  if(c) c.addEventListener('click', closeModal);
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('show');
}
document.getElementById('modal-bg').addEventListener('click', e=>{
  if(e.target.id==='modal-bg') closeModal();
});

/* =========================================================
   VIEW HANDLERS ATTACH
========================================================= */
function attachViewHandlers(){
  // ajukan form
  const form = document.getElementById('form-ajukan');
  if(form){
    renderItemRows();
    document.getElementById('btn-add-item').addEventListener('click', ()=>{
      draftItems.push({deskripsi:'', qty:1, harga:''});
      renderItemRows();
    });
    ['f-ppn-aktif','f-pph-aktif'].forEach(id=>{
      document.getElementById(id).addEventListener('change', e=>{
        document.getElementById(id==='f-ppn-aktif'?'ppn-controls':'pph-controls').style.display = e.target.checked?'flex':'none';
        recalcDraft();
      });
    });
    ['f-ppn-persen','f-pph-persen'].forEach(id=>{
      document.getElementById(id).addEventListener('input', recalcDraft);
    });
    recalcDraft();

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const items = draftItems.filter(it=>it.deskripsi.trim() && Number(it.qty)>0 && Number(it.harga)>0);
      if(!items.length){ alert('Isi minimal satu baris rincian biaya (deskripsi, qty, dan harga).'); return; }
      const rec = {
        id: uid('P'), nomor: nextNomor(),
        noInvoice: document.getElementById('f-noinvoice').value.trim(),
        tanggalPengajuan: document.getElementById('f-tanggal').value,
        pemohon: document.getElementById('f-pemohon').value.trim(),
        dibayarkanKepada: document.getElementById('f-kepada').value.trim(),
        kegiatan: document.getElementById('f-kegiatan').value.trim(),
        proyek: document.getElementById('f-proyek').value.trim(),
        bankTujuan: document.getElementById('f-bank').value.trim(),
        noRekening: document.getElementById('f-norek').value.trim(),
        atasNama: document.getElementById('f-atasnama').value.trim(),
        items: items.map(it=>({deskripsi:it.deskripsi.trim(), qty:Number(it.qty), harga:Number(it.harga)})),
        ppnAktif: document.getElementById('f-ppn-aktif').checked,
        ppnPersen: Number(document.getElementById('f-ppn-persen').value)||0,
        pphAktif: document.getElementById('f-pph-aktif').checked,
        pphJenis: document.getElementById('f-pph-jenis').value,
        pphPersen: Number(document.getElementById('f-pph-persen').value)||0,
        dueDate: document.getElementById('f-duedate').value,
        keterangan: document.getElementById('f-keterangan').value.trim(),
        status:'Menunggu Persetujuan', catatan:'', approvedBy:'', approvedAt:'',
        dibayar:false, tanggalBayar:'', noVoucher:'', dibayarOleh:''
      };
      DB.pengajuan.push(rec);
      saveData();
      toast('Pengajuan terkirim, menunggu persetujuan.');
      goto('karyawan-list');
    });
  }

  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click', ()=>openDetail(b.dataset.detail)));
  document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click', ()=>openReview(b.dataset.review)));
  document.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click', ()=>openPay(b.dataset.pay)));

  const addUserBtn = document.getElementById('btn-add-user');
  if(addUserBtn) addUserBtn.addEventListener('click', ()=>openUserForm(null));
  document.querySelectorAll('[data-edit-user]').forEach(b=>b.addEventListener('click', ()=>openUserForm(b.dataset.editUser)));
  document.querySelectorAll('[data-del-user]').forEach(b=>b.addEventListener('click', ()=>deleteUser(b.dataset.delUser)));

  // Saldo
  const btnSaveSaldo = document.getElementById('btn-save-saldo');
  if(btnSaveSaldo){
    btnSaveSaldo.addEventListener('click', ()=>{
      const v = Number(document.getElementById('sa-jumlah').value);
      if(isNaN(v) || v<0){ alert('Isi jumlah saldo awal yang valid.'); return; }
      DB.saldoAwal = v; saveData(); toast('Saldo awal disimpan.'); render();
    });
  }
  const btnAddTx = document.getElementById('btn-add-tx');
  if(btnAddTx){
    btnAddTx.addEventListener('click', ()=>{
      const tanggal = document.getElementById('tx-tanggal').value;
      const jenis = document.getElementById('tx-jenis').value;
      const tipe = document.getElementById('tx-tipe').value;
      const jumlah = Number(document.getElementById('tx-jumlah').value);
      const keterangan = document.getElementById('tx-keterangan').value.trim();
      if(!tanggal){ alert('Tanggal wajib diisi.'); return; }
      if(!jumlah || jumlah<=0){ alert('Isi jumlah yang valid.'); return; }
      DB.transaksiKas = DB.transaksiKas || [];
      DB.transaksiKas.push({id:uid('T'), tanggal, jenis, tipe, keterangan, jumlah});
      saveData(); toast('Transaksi ditambahkan.'); render();
    });
  }
  document.querySelectorAll('[data-del-tx]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Hapus transaksi ini?')) return;
    DB.transaksiKas = (DB.transaksiKas||[]).filter(t=>t.id!==b.dataset.delTx);
    saveData(); toast('Transaksi dihapus.'); render();
  }));

  // Riwayat Pembayaran (filter & export)
  const btnFhFilter = document.getElementById('btn-fh-filter');
  if(btnFhFilter){
    btnFhFilter.addEventListener('click', ()=>{
      FH_FROM = document.getElementById('fh-dari').value || null;
      FH_TO = document.getElementById('fh-sampai').value || null;
      if(FH_FROM && FH_TO && FH_FROM > FH_TO){ alert('Tanggal "Dari" tidak boleh lebih besar dari "Sampai".'); return; }
      render();
    });
    document.getElementById('btn-fh-reset').addEventListener('click', ()=>{
      FH_FROM = null; FH_TO = null; render();
    });
    document.getElementById('btn-fh-excel').addEventListener('click', exportFinanceHistoryExcel);
    document.getElementById('btn-fh-pdf').addEventListener('click', exportFinanceHistoryPDF);
  }

  // Pengaturan
  const btnSavePengaturan = document.getElementById('btn-save-pengaturan');
  if(btnSavePengaturan){
    btnSavePengaturan.addEventListener('click', ()=>{
      DB.pengaturan = {
        namaPerusahaan: document.getElementById('pg-nama').value.trim(),
        npwp: document.getElementById('pg-npwp').value.trim()
      };
      saveData(); toast('Pengaturan disimpan.'); render();
    });
  }

  // Cash Flow Bulanan
  const cfYear = document.getElementById('cf-year');
  if(cfYear){
    cfYear.addEventListener('change', e=>{ CF_YEAR = Number(e.target.value); render(); });
    const btnCsv = document.getElementById('btn-cf-csv');
    if(btnCsv) btnCsv.addEventListener('click', ()=>{
      const year = CF_YEAR || new Date().getFullYear();
      const rows = [['Bulan','Saldo Awal','Kas Masuk','Kas Keluar','Saldo Akhir']];
      document.querySelectorAll('#cf-table tbody tr').forEach(tr=>{
        rows.push(Array.from(tr.children).map(td=>td.textContent.trim()));
      });
      exportCSV('cashflow-bulanan-'+year+'.csv', rows);
    });
    const btnPrint = document.getElementById('btn-cf-print');
    if(btnPrint) btnPrint.addEventListener('click', ()=>{
      const year = CF_YEAR || new Date().getFullYear();
      printHTML('Cash Flow Bulanan — Tahun '+year, document.getElementById('cf-table').outerHTML);
    });
  }

  // Cash Flow Harian
  const cfhMonth = document.getElementById('cfh-month');
  if(cfhMonth){
    cfhMonth.addEventListener('change', e=>{ CF_MONTH = e.target.value; render(); });
    const btnCsv = document.getElementById('btn-cfh-csv');
    if(btnCsv) btnCsv.addEventListener('click', ()=>{
      const monthVal = CF_MONTH || cfhMonth.value;
      const rows = [['Tanggal','Hari','Status','Saldo Awal','Pemasukan','Pengeluaran','Saldo Akhir']];
      document.querySelectorAll('#cfh-table tbody tr').forEach(tr=>{
        rows.push(Array.from(tr.children).map(td=>td.textContent.trim()));
      });
      exportCSV('cashflow-harian-'+monthVal+'.csv', rows);
    });
    const btnPrint = document.getElementById('btn-cfh-print');
    if(btnPrint) btnPrint.addEventListener('click', ()=>{
      const monthVal = CF_MONTH || cfhMonth.value;
      printHTML('Detail Cash Flow Harian — '+monthVal, document.getElementById('cfh-table').outerHTML);
    });
  }
}
</script>
